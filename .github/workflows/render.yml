name: Render video

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package*.json', '.github/workflows/render.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system libraries for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 \
            fonts-noto-color-emoji
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - run: npm ci

      - name: Download headless browser
        run: npx remotion browser ensure

      - name: Type-check
        run: npx tsc

      - name: Render video
        run: npx remotion render src/index.ts PrinterInk out/printer-ink.mp4 --codec=h264 --crf=18 --audio-bitrate=320k --concurrency=100% --log=info

      - name: Normalize loudness for YouTube (-14 LUFS)
        run: |
          npx remotion ffmpeg -v error -y -i out/printer-ink.mp4 -c:v copy -af loudnorm=I=-14:TP=-1.5:LRA=11 -ar 48000 -c:a aac -b:a 256k out/normalized.mp4
          mv out/normalized.mp4 out/printer-ink.mp4

      - name: Render thumbnail frame
        run: npx remotion still src/index.ts PrinterInk out/thumbnail-frame.png --frame=95

      - uses: actions/upload-artifact@v4
        with:
          name: printer-ink-video
          path: out/*
          retention-days: 30

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ github.run_number }}
          name: Printer Ink video (render ${{ github.run_number }})
          body: Rendered from ${{ github.sha }}.
          files: |
            out/printer-ink.mp4
            out/thumbnail-frame.png
